name: "erdraw"
description: "Draws the Mermaid ER diagram of a PostgreSQL or MySQL database, into a file and your README"
author: "sugomi-dev"
branding:
  icon: "database"
  color: "green"

inputs:
  url:
    description: "Connection URL: postgres://user:password@host:5432/db or mysql://user:password@host:3306/db. Replaces type, host, port, database, user and password."
    required: false
  type:
    description: "postgresql or mysql (default: postgresql)"
    required: false
  host:
    description: "Database host (default: localhost)"
    required: false
  port:
    description: "Database port (default: 5432 for postgresql, 3306 for mysql)"
    required: false
  database:
    description: "Database name (required without url)"
    required: false
  user:
    description: "Database user (required without url)"
    required: false
  password:
    description: "Database password"
    required: false
  ssl:
    description: "Encrypt the connection, without verifying the certificate (default: false; sslmode=require in the url does the same)"
    required: false
  schemas:
    description: "PostgreSQL schemas to draw, comma-separated (default: public). With several, tables are named schema.table."
    required: false
  exclude:
    description: "Tables to leave out, comma-separated; * matches anything (e.g. audit_*). Migration tools' tables are always left out."
    required: false
  output:
    description: "File the diagram is written to (default: docs/database.mmd)"
    required: false
  readme:
    description: "Markdown file to write the diagram into, between <!-- ER_DIAGRAM_START --> and <!-- ER_DIAGRAM_END --> (default: none)"
    required: false
  indexes:
    description: "Show each index as a comment on its first column (default: false)"
    required: false
  commit:
    description: "Commit and push the diagram when it changed (default: false). Needs contents: write and a checked-out branch."
    required: false
  commit-message:
    description: "Message of that commit (default: docs: update the database diagram)"
    required: false
  commit-author:
    description: "Author of that commit, as 'Name <email>' (default: the github-actions bot)"
    required: false

outputs:
  diagram:
    description: "The Mermaid diagram"
  path:
    description: "The file it was written to"
  changed:
    description: "true when the diagram or the README changed"

runs:
  using: "node24"
  main: "dist/index.cjs"
