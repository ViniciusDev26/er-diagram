name: release

# release-please keeps a release PR open from the Conventional Commits on main. Merging it tags
# the version and publishes the GitHub release; the major tag (`v5`) then moves to it, since the
# Action is used by its major version, and the command line is published to npm.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # With a token of its own (RELEASE_PLEASE_TOKEN), the release PR runs the checks: GitHub
      # runs no workflow for a PR opened with GITHUB_TOKEN.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  major-tag:
    name: Move the major tag
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          major="v${VERSION%%.*}"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"

  npm:
    name: Publish to npm
    needs: release-please
    # Trusted publishing (OIDC), no token: on once npmjs.com trusts this workflow for erdraw and the
    # repository variable NPM_PUBLISH is true.
    if: needs.release-please.outputs.created == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
